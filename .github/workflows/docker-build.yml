name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # Bouton « Run workflow » (onglet Actions, utilisable depuis un téléphone) : crée
  # le tag sur la branche choisie puis construit l'image, sans terminal.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, par ex. v1.2.0'
        required: true
        type: string

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    runs-on: ubuntu-26.04
    needs: tests
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine and create the version tag
        id: tag
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "$REQUESTED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version invalide « $REQUESTED » : utiliser le format v1.2.0."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$REQUESTED" >/dev/null; then
            echo "::error::Le tag $REQUESTED existe déjà."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$REQUESTED" -m "$REQUESTED" "$GITHUB_SHA"
          git push origin "refs/tags/$REQUESTED"
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-26.04
    needs: version
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepsky-portfolio:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/deepsky-portfolio:latest

  release:
    runs-on: ubuntu-26.04
    needs: [version, build]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)

          GENERATED_NOTES=$(gh api \
            --method POST \
            "/repos/${REPO}/releases/generate-notes" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${TAG}" \
            | jq -r '.body')

          {
            echo "## Image Docker"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/deepsky-portfolio:${TAG}"
            echo "docker pull ghcr.io/${{ github.repository_owner }}/deepsky-portfolio:latest"
            echo '```'
            echo
            echo "[Voir le package sur GHCR](https://github.com/${REPO}/pkgs/container/deepsky-portfolio)"
            echo
            echo "---"
            echo
            echo "$GENERATED_NOTES"
            echo
            echo "---"
            echo

            if [ -n "$PREV_TAG" ]; then
              echo "## Commits (${PREV_TAG}...${TAG})"
              echo
              git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (\`%h\`)" --no-merges
              echo
              echo
              echo "## Fichiers modifiés"
              echo
              echo '```'
              git diff --stat "${PREV_TAG}..${TAG}"
              echo '```'
            else
              echo "## Commits"
              echo
              git log --pretty=format:"- %s (\`%h\`)" --no-merges -50
            fi
          } > release-notes.md

          gh release create "$TAG" \
            --title "Release ${TAG}" \
            --notes-file release-notes.md
