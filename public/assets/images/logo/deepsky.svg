<!-- SVG 1 -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
                  <defs>
                    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#0B0B19"></stop>
                      <stop offset="100%" stop-color="#1A1B41"></stop>
                    </linearGradient>
                    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
                      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
                      <feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
                    </filter>
                  </defs>
                  <!-- Background -->
                  <rect width="256" height="256" rx="56" fill="url(#bg-grad-1)"></rect>
                  
                  <!-- Focus Brackets (Camera) -->
                  <path d="M 72 100 L 72 72 L 100 72" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="M 184 100 L 184 72 L 156 72" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="M 72 156 L 72 184 L 100 184" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
                  <path d="M 184 156 L 184 184 L 156 184" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
                  
                  <!-- Constellation Lines -->
                  <polyline points="100,120 140,95 160,145 120,165 100,120" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"></polyline>
                  
                  <!-- Stars -->
                  <circle cx="100" cy="120" r="4" fill="#FFFFFF" filter="url(#glow-1)"></circle>
                  <circle cx="140" cy="95" r="7" fill="#60A5FA" filter="url(#glow-1)"></circle>
                  <circle cx="160" cy="145" r="5" fill="#FFFFFF" filter="url(#glow-1)"></circle>
                  <circle cx="120" cy="165" r="3" fill="#A78BFA" filter="url(#glow-1)"></circle>
                </svg>