[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:octane]
; OCTANE_WORKERS (2 par défaut) : sans valeur, FrankenPHP lance 2 workers par cœur,
; chacun avec l'application chargée en mémoire.
command=php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019 --workers=%(ENV_OCTANE_WORKERS)s --max-requests=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
autostart=true
autorestart=true

; Un seul worker pour les deux files : « default » d'abord, puis « media » (conversions
; Imagick). Les jobs longs déclarent leur propre timeout (900 s) ; --memory relance le
; worker après une conversion gourmande pour rendre la mémoire au système.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=default,media --tries=3 --timeout=120 --memory=256 --max-time=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
autostart=true
autorestart=true
stopwaitsecs=910

[program:scheduler]
command=php /var/www/html/artisan schedule:work
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
autostart=true
autorestart=true